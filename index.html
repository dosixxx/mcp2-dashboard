    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- 제목이 700 을 쓴다. 안 받아두면 브라우저가 600 을 늘려 가짜 볼드를 만들고,
         56px 헤드라인에서 획이 뭉개진다. -->

    <style>
      /* 흰 종이. 스크롤 튐 방지로 바탕색을 body 에도 박는다. */
      html, body { background: #ffffff; margin: 0; }
      ::selection { background: #bf30211f; }

      /* 넓은 표의 가로 추적. 줄무늬는 인쇄·스크린샷에서, 호버는 화면에서 일한다.
         둘 다 아주 옅게 — 여기서 색이 세지면 의미색(보라·청록·빨강)과 경쟁한다. */
      .dt tbody tr:nth-child(even) { background: #f4f5f2; }
      .dt tbody tr:hover { background: #e6eae3; }
      /* sticky 헤더·합계행이 줄무늬 위로 지나가야 하므로 불투명 배경을 유지한다. */
      .dt thead th, .dt tfoot td { background: #ffffff; }
